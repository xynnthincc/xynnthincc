<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Zakii Maalik — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050a"/>
      <stop offset="100%" stop-color="#070b13"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- threads -->
  <g filter="url(#glow)" stroke-linecap="round" fill="none">
    <path d="M-80 70 C 220 20, 420 110, 620 60 S 920 130, 1280 80" stroke="url(#t1)" stroke-width="1.3" stroke-dasharray="220 900">
      <animate attributeName="stroke-dashoffset" from="0" to="-1120" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 130 C 200 90, 400 170, 600 120 S 900 190, 1280 140" stroke="url(#t2)" stroke-width="1.1" stroke-dasharray="180 860">
      <animate attributeName="stroke-dashoffset" from="0" to="-1040" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 190 C 220 150, 420 230, 620 180 S 920 250, 1280 200" stroke="url(#t3)" stroke-width="1.0" stroke-dasharray="160 920">
      <animate attributeName="stroke-dashoffset" from="0" to="-1080" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 230 C 200 190, 400 270, 600 220 S 900 290, 1280 240" stroke="url(#t4)" stroke-width="1.2" stroke-dasharray="200 880">
      <animate attributeName="stroke-dashoffset" from="0" to="-1080" dur="7.5s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 95 C 260 55, 380 155, 580 105 S 880 175, 1280 125" stroke="url(#t1)" stroke-width="0.8" stroke-dasharray="120 960" opacity="0.45">
      <animate attributeName="stroke-dashoffset" from="0" to="-1080" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 165 C 240 125, 440 205, 640 155 S 920 225, 1280 175" stroke="url(#t2)" stroke-width="0.8" stroke-dasharray="140 940" opacity="0.45">
      <animate attributeName="stroke-dashoffset" from="0" to="-1080" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- left accent bar -->
  <rect x="72" y="90" width="5" height="100" rx="2.5" fill="url(#t2)"/>

  <!-- eyebrow -->
  <text x="96" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#94a3b8">FULL STACK DEVELOPER</text>

  <!-- title -->
  <text x="96" y="140" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="#ffffff">Zakii Maalik</text>

  <!-- handle -->
  <text x="96" y="172" font-family="'Fira Code', ui-monospace, monospace" font-size="18" font-weight="500" fill="#cbd5e1">xynnthincc</text>

  <!-- subtitle -->
  <text x="96" y="202" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">Web · Mobile · Cloud · Web3</text>

  <!-- animated accent divider -->
  <rect x="96" y="228" width="240" height="3" rx="1.5" fill="url(#t2)">
    <animate attributeName="width" values="240;400;240" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner badge -->
  <g transform="translate(1020,30)">
    <rect width="132" height="30" rx="15" fill="#0b1220" stroke="url(#t4)" stroke-width="1.2" opacity="0.95"/>
    <circle cx="16" cy="15" r="3.5" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="20" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="11" font-weight="600" fill="#e0f2fe">OPEN TO WORK</text>
  </g>
</svg>
