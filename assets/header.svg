<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Zakii Maalik — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0a0f17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- light particles -->
  <g filter="url(#soft)">
    <circle cx="120" cy="55" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="105" r="1.1" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.0s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="40" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="85" r="1.2" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.85;0.1" dur="4.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="50" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.8s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="115" r="1.1" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.1s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="65" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1070" cy="135" r="1.2" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.85;0.1" dur="4.3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="225" r="1.0" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="3.7s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="245" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="235" r="1.1" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.9s" begin="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="255" r="1.4" fill="#22d3ee"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.7s" begin="1.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- left accent bar -->
  <rect x="72" y="96" width="5" height="110" rx="2.5" fill="url(#accent)"/>

  <!-- eyebrow -->
  <text x="96" y="84" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#94a3b8">FULL STACK DEVELOPER</text>

  <!-- title -->
  <text x="96" y="146" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#title)">Zakii Maalik</text>

  <!-- handle -->
  <text x="96" y="180" font-family="'Fira Code', ui-monospace, monospace" font-size="19" font-weight="500" fill="#cbd5e1">xynnthincc</text>

  <!-- subtitle -->
  <text x="96" y="212" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">Web · Mobile · Cloud · Web3</text>

  <!-- animated accent divider -->
  <rect x="96" y="240" width="240" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="240;420;240" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner badge -->
  <g transform="translate(1018, 34)">
    <rect width="132" height="32" rx="16" fill="#0b1220" stroke="url(#accent)" stroke-width="1.2" opacity="0.95"/>
    <circle cx="18" cy="17" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="22" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="12" font-weight="600" fill="#e0f2fe">OPEN TO WORK</text>
  </g>
</svg>
