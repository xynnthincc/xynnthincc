<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="xynnthincc — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#06b6d4;#7c3aed" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#7c3aed;#06b6d4" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1f2630" stroke-width="1" opacity="0.4">
    <path d="M0 240 L1200 240" />
    <path d="M0 60 L1200 60" />
    <path d="M100 0 L100 300" />
    <path d="M1100 0 L1100 300" />
  </g>

  <!-- left accent bar -->
  <rect x="72" y="108" width="4" height="84" rx="2" fill="url(#accent)"/>

  <!-- eyebrow -->
  <text x="92" y="92" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="3" fill="#64748b" text-transform="uppercase">FULL STACK DEVELOPER</text>

  <!-- title -->
  <text x="92" y="150" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="700" fill="url(#title)" filter="url(#glow)">Zakii Maalik</text>

  <!-- handle line -->
  <text x="92" y="184" font-family="'Fira Code', ui-monospace, monospace" font-size="18" font-weight="500" fill="#94a3b8">xynnthincc</text>

  <!-- subtitle -->
  <text x="92" y="216" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#64748b">Web · Mobile · Cloud · Web3</text>

  <!-- animated accent divider -->
  <rect x="92" y="244" width="220" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="width" values="220;400;220" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner badge -->
  <g transform="translate(1030, 40)">
    <rect width="118" height="30" rx="15" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.9"/>
    <text x="59" y="20" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="12" font-weight="500" fill="#a78bfa">open to work</text>
  </g>
</svg>
