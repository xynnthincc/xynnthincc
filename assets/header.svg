<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="xynnthincc — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="55%" stop-color="#120a26"/>
      <stop offset="100%" stop-color="#061018"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.82" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.18" cy="0.78" r="0.5">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#orb1)"/>
  <rect width="1200" height="300" fill="url(#orb2)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- bottom silhouette horizon -->
  <path d="M0 260 Q 300 220 600 250 T 1200 230 L 1200 300 L 0 300 Z" fill="#0b1220" opacity="0.7"/>

  <!-- left accent bar -->
  <rect x="72" y="100" width="5" height="100" rx="2.5" fill="url(#accent)"/>

  <!-- eyebrow -->
  <text x="92" y="88" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#94a3b8">FULL STACK DEVELOPER</text>

  <!-- title -->
  <text x="92" y="148" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#title)" filter="url(#glow)">Zakii Maalik</text>

  <!-- handle -->
  <text x="92" y="182" font-family="'Fira Code', ui-monospace, monospace" font-size="19" font-weight="500" fill="#cbd5e1">xynnthincc</text>

  <!-- subtitle -->
  <text x="92" y="214" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">Web · Mobile · Cloud · Web3</text>

  <!-- animated accent divider -->
  <rect x="92" y="242" width="240" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="240;440;240" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner badge -->
  <g transform="translate(1020, 36)">
    <rect width="132" height="32" rx="16" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.9"/>
    <text x="66" y="21" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="12" font-weight="600" fill="#e9d5ff">OPEN TO WORK</text>
  </g>
</svg>
