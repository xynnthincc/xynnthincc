<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Zakii Maalik — Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- light particles -->
  <g filter="url(#soft)">
    <circle cx="140" cy="60" r="1.6" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="110" r="1.2" fill="#a78bfa"><animate attributeName="opacity" values="0.1;0.85;0.1" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="45" r="1.4" fill="#22d3ee"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.7s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="90" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="55" r="1.5" fill="#a78bfa"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.9s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="120" r="1.2" fill="#22d3ee"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="70" r="1.6" fill="#ffffff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="140" r="1.3" fill="#a78bfa"><animate attributeName="opacity" values="0.1;0.85;0.1" dur="4.0s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="230" r="1.1" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="3.6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="250" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.2s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="240" r="1.2" fill="#a78bfa"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.8s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="260" r="1.5" fill="#22d3ee"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.6s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- left accent bar -->
  <rect x="72" y="96" width="5" height="110" rx="2.5" fill="url(#accent)"/>

  <!-- eyebrow -->
  <text x="96" y="84" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#94a3b8">FULL STACK DEVELOPER</text>

  <!-- title -->
  <text x="96" y="146" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#title)">Zakii Maalik</text>

  <!-- handle -->
  <text x="96" y="180" font-family="'Fira Code', ui-monospace, monospace" font-size="19" font-weight="500" fill="#cbd5e1">xynnthincc</text>

  <!-- subtitle -->
  <text x="96" y="212" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">Web · Mobile · Cloud · Web3</text>

  <!-- animated accent divider -->
  <rect x="96" y="240" width="240" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="240;420;240" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner badge -->
  <g transform="translate(1018, 34)">
    <rect width="132" height="32" rx="16" fill="#0b1220" stroke="url(#accent)" stroke-width="1.2" opacity="0.95"/>
    <circle cx="18" cy="17" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="22" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="12" font-weight="600" fill="#e9d5ff">OPEN TO WORK</text>
  </g>
</svg>
