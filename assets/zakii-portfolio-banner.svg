<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Zakii Maalik — Full Stack Developer</title>
  <desc id="desc">A clean dark portfolio banner with a glowing name panel, technology labels, and a compact animated code window.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B12"/>
      <stop offset="0.52" stop-color="#101326"/>
      <stop offset="1" stop-color="#09151D"/>
    </linearGradient>
    <linearGradient id="nameGradient" x1="96" y1="98" x2="470" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1ECFF"/>
      <stop offset="0.48" stop-color="#B8A0FF"/>
      <stop offset="1" stop-color="#8C65F8"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="58" y1="80" x2="58" y2="243" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72E7F8"/>
      <stop offset="0.55" stop-color="#8D79FF"/>
      <stop offset="1" stop-color="#C18AFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="60" y1="48" x2="690" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="codeFill" x1="730" y1="48" x2="1140" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11192A" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="bottomLine" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7F6BFF" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#79DAF5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9E78FF" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 93) rotate(90) scale(170 300)">
      <stop stop-color="#6858EC" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#6858EC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 168) rotate(90) scale(150 265)">
      <stop stop-color="#23C8D8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#23C8D8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#BAC7FF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="panelShadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="canvasClip"><rect width="1200" height="320" rx="0"/></clipPath>
    <clipPath id="codeClip"><rect x="730" y="48" width="410" height="224" rx="23"/></clipPath>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 3.1px; fill: #B9B4FF; }
      .meta { font-size: 15px; fill: #DBE3FA; }
      .tag { font-size: 11px; font-weight: 650; letter-spacing: .15px; }
      .code { font-size: 13px; }
      .ambient-violet { animation: driftViolet 13s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .ambient-cyan { animation: driftCyan 16s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .status-dot { animation: statusPulse 2.8s ease-in-out infinite; }
      .cursor { animation: blink 1.05s steps(2, start) infinite; }
      .trace { stroke-dasharray: 5 15; animation: trace 12s linear infinite; }
      @keyframes driftViolet { from { transform: translate(-5px, 2px) scale(1); opacity: .74; } to { transform: translate(15px, -7px) scale(1.08); opacity: 1; } }
      @keyframes driftCyan { from { transform: translate(8px, 1px) scale(1); opacity: .65; } to { transform: translate(-12px, -8px) scale(1.08); opacity: 1; } }
      @keyframes statusPulse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @keyframes trace { to { stroke-dashoffset: -240; } }
      @media (prefers-reduced-motion: reduce) {
        .ambient-violet, .ambient-cyan, .status-dot, .cursor, .trace { animation: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#violetGlow)"/>
    <rect width="1200" height="320" fill="url(#cyanGlow)"/>
    <ellipse class="ambient-violet" cx="286" cy="80" rx="176" ry="92" fill="#6D55EE" opacity="0.11" filter="url(#softBlur)"/>
    <ellipse class="ambient-cyan" cx="968" cy="204" rx="142" ry="88" fill="#24C9D9" opacity="0.09" filter="url(#softBlur)"/>

    <!-- Profile panel -->
    <g filter="url(#panelShadow)">
      <rect x="60" y="48" width="630" height="224" rx="23" fill="url(#panelFill)" stroke="#D7DFFF" stroke-opacity="0.16"/>
      <path d="M61 73H689" stroke="#FFFFFF" stroke-opacity="0.035"/>
      <path d="M61 246H689" stroke="#FFFFFF" stroke-opacity="0.035"/>
      <path d="M61 76V239" stroke="url(#accentGradient)" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle cx="88" cy="77" r="3" fill="#9B8AFF"/>
    <text x="100" y="81" class="eyebrow">FULL STACK DEVELOPER</text>
    <text x="91" y="135" font-size="53" font-weight="760" letter-spacing="-2.4" fill="url(#nameGradient)">Zakii Maalik</text>
    <text x="94" y="166" font-size="16" font-weight="520" fill="#DCE8FF">@xynnthinc</text>
    <path d="M94 184H215" stroke="#7FE3F4" stroke-opacity="0.95" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M222 184H268" stroke="#A88DFF" stroke-opacity="0.38" stroke-width="1.6" stroke-linecap="round"/>
    <text x="94" y="211" class="meta">Web <tspan fill="#807CF6">·</tspan> Mobile <tspan fill="#807CF6">·</tspan> Cloud <tspan fill="#807CF6">·</tspan> Web3</text>

    <!-- Technology labels -->
    <g transform="translate(94 231)">
      <rect width="76" height="22" rx="11" fill="#8A79FF" fill-opacity="0.10" stroke="#9A8DFF" stroke-opacity="0.62"/>
      <text x="38" y="14.5" text-anchor="middle" class="tag" fill="#C9BEFF">TypeScript</text>
    </g>
    <g transform="translate(179 231)">
      <rect width="66" height="22" rx="11" fill="#54DDF0" fill-opacity="0.08" stroke="#65D7E9" stroke-opacity="0.58"/>
      <text x="33" y="14.5" text-anchor="middle" class="tag" fill="#8BEAF4">Next.js</text>
    </g>
    <g transform="translate(254 231)">
      <rect width="48" height="22" rx="11" fill="#A0A7FF" fill-opacity="0.07" stroke="#939CF9" stroke-opacity="0.50"/>
      <text x="24" y="14.5" text-anchor="middle" class="tag" fill="#C5CCFF">.NET</text>
    </g>
    <g transform="translate(311 231)">
      <rect width="62" height="22" rx="11" fill="#F5BE57" fill-opacity="0.07" stroke="#F5BE57" stroke-opacity="0.56"/>
      <text x="31" y="14.5" text-anchor="middle" class="tag" fill="#F6CF7B">Kotlin</text>
    </g>
    <g transform="translate(382 231)">
      <rect width="68" height="22" rx="11" fill="#F071B2" fill-opacity="0.07" stroke="#E979B4" stroke-opacity="0.55"/>
      <text x="34" y="14.5" text-anchor="middle" class="tag" fill="#F5A1D0">Laravel</text>
    </g>

    <!-- Compact code / availability panel -->
    <g filter="url(#panelShadow)">
      <rect x="730" y="48" width="410" height="224" rx="23" fill="url(#codeFill)" stroke="#B7C9F4" stroke-opacity="0.16"/>
      <path d="M731 91H1139" stroke="#B7C9F4" stroke-opacity="0.13"/>
    </g>
    <g clip-path="url(#codeClip)">
      <rect x="730" y="48" width="410" height="43" fill="#FFFFFF" fill-opacity="0.025"/>
      <circle cx="751" cy="69.5" r="4.4" fill="#FF777F"/>
      <circle cx="766" cy="69.5" r="4.4" fill="#FFC56B"/>
      <circle cx="781" cy="69.5" r="4.4" fill="#50D6A0"/>
      <text x="800" y="73" class="mono" font-size="10.5" fill="#9CADD0">workspace/profile.ts</text>
      <rect x="1023" y="57" width="99" height="24" rx="12" fill="#32D399" fill-opacity="0.10" stroke="#32D399" stroke-opacity="0.58"/>
      <circle class="status-dot" cx="1037" cy="69" r="2.5" fill="#4EE6AC"/>
      <text x="1045" y="72.5" font-size="9.5" font-weight="700" letter-spacing=".45" fill="#75E7B9">AVAILABLE</text>

      <text x="749" y="113" class="mono code" fill="#B8A3FF">const</text>
      <text x="790" y="113" class="mono code" fill="#DDE5FF">developer</text>
      <text x="870" y="113" class="mono code" fill="#C5D0E7">= {</text>

      <text x="766" y="136" class="mono code" fill="#8FCAFF">name:</text>
      <text x="813" y="136" class="mono code" fill="#A8E9D2">"Zakii Maalik"</text>
      <text x="766" y="158" class="mono code" fill="#8FCAFF">role:</text>
      <text x="813" y="158" class="mono code" fill="#A8E9D2">"Full Stack Dev"</text>
      <text x="766" y="180" class="mono code" fill="#8FCAFF">focus:</text>
      <text x="813" y="180" class="mono code" fill="#F5C875">["web", "mobile", "cloud"]</text>
      <text x="749" y="201" class="mono code" fill="#C5D0E7">};</text>

      <path d="M749 212H1120" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="749" y="233" class="mono" font-size="12.5" fill="#76E3C0">$</text>
      <text x="764" y="233" class="mono" font-size="12.5" fill="#DCE5FF">npm run build</text>
      <rect class="cursor" x="868" y="222" width="7" height="14" rx="1.5" fill="#9C8BFF"/>
      <text x="1118" y="233" class="mono" font-size="13" text-anchor="end" fill="#85DDBF">✓</text>
    </g>

    <!-- A quiet animated accent along the lower edge -->
    <path d="M60 294H1140" stroke="url(#bottomLine)" stroke-width="1.4"/>
    <path class="trace" d="M60 294H1140" stroke="#9EE9F2" stroke-opacity="0.8" stroke-width="1.4"/>
    <circle cx="60" cy="294" r="2.2" fill="#9B8AFF"/>
    <circle cx="1140" cy="294" r="2.2" fill="#7EE5F1"/>
  </g>
</svg>
