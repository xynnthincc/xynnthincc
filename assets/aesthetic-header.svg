<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Zakii Maalik — Full Stack Developer">
  <title>Zakii Maalik — Full Stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="55%" stop-color="#0a0d1a"/>
      <stop offset="100%" stop-color="#0d1326"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="auroraBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- animated aurora blobs -->
  <g filter="url(#auroraBlur)">
    <circle cx="260" cy="120" r="200" fill="url(#aurora1)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 60,30; -20,15; 0,0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;1;0.9;0.85" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="190" r="230" fill="url(#aurora2)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -50,-20; 30,25; 0,0" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.95;0.75;0.7" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="260" r="160" fill="#a78bfa" fill-opacity="0.22">
      <animateTransform attributeName="transform" type="translate" values="0,0; 40,-30; -30,20; 0,0" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M120 0V300M240 0V300M360 0V300M480 0V300M600 0V300M720 0V300M840 0V300M960 0V300M1080 0V300"/>
  </g>

  <!-- twinkling stars -->
  <g filter="url(#soft)">
    <circle cx="110" cy="45" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="90" r="1.0" fill="#c4b5fd"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="50" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="100" r="1.1" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="4.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="55" r="1.5" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.7s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="110" r="1.0" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="60" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="130" r="1.0" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="245" r="1.1" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.9s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="255" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="250" r="1.0" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="4.1s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="260" r="1.4" fill="#a78bfa"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.8s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- vignette -->
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- glass panel -->
  <g transform="translate(60,46)">
    <rect width="640" height="208" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <rect width="640" height="1" x="0" y="0" fill="#ffffff" fill-opacity="0.18"/>
    <!-- left accent bar -->
    <rect x="0" y="28" width="4" height="152" rx="2" fill="url(#accent)"/>
    <!-- eyebrow -->
    <g transform="translate(34,30)">
      <circle cx="6" cy="6" r="3" fill="#a78bfa"/>
      <text x="16" y="10" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#a5b4fc">FULL STACK DEVELOPER</text>
    </g>
    <!-- name -->
    <text x="34" y="90" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)">Zakii Maalik</text>
    <!-- handle -->
    <text x="34" y="118" font-family="'Fira Code', ui-monospace, monospace" font-size="19" font-weight="500" fill="#cbd5e1">@xynnthincc</text>
    <!-- divider -->
    <rect x="34" y="134" width="120" height="2" rx="1" fill="url(#accent)">
      <animate attributeName="width" values="120;260;120" dur="6s" repeatCount="indefinite"/>
    </rect>
    <!-- tagline -->
    <text x="34" y="160" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#cbd5e1">Web · Mobile · Cloud · Web3</text>
    <!-- mini chips -->
    <g transform="translate(34,180)" font-family="'Fira Code', ui-monospace, monospace" font-size="10.5" font-weight="600">
      <g>
        <rect width="78" height="18" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.5"/>
        <text x="39" y="12.5" text-anchor="middle" fill="#c4b5fd">TypeScript</text>
      </g>
      <g transform="translate(88,0)">
        <rect width="62" height="18" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#67e8f9" stroke-opacity="0.5"/>
        <text x="31" y="12.5" text-anchor="middle" fill="#67e8f9">Next.js</text>
      </g>
      <g transform="translate(160,0)">
        <rect width="46" height="18" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#34d399" stroke-opacity="0.5"/>
        <text x="23" y="12.5" text-anchor="middle" fill="#34d399">.NET</text>
      </g>
      <g transform="translate(216,0)">
        <rect width="64" height="18" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#fbbf24" stroke-opacity="0.5"/>
        <text x="32" y="12.5" text-anchor="middle" fill="#fbbf24">Kotlin</text>
      </g>
      <g transform="translate(290,0)">
        <rect width="74" height="18" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#f472b6" stroke-opacity="0.5"/>
        <text x="37" y="12.5" text-anchor="middle" fill="#f472b6">Laravel</text>
      </g>
    </g>
  </g>

  <!-- status pill -->
  <g transform="translate(930,40)" filter="url(#glow)">
    <rect width="210" height="38" rx="19" fill="#0b1220" fill-opacity="0.7" stroke="url(#accent)" stroke-width="1.2"/>
    <circle cx="22" cy="19" r="4.5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="118" y="23" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#e0f2fe" letter-spacing="1.5">AVAILABLE FOR WORK</text>
  </g>

  <!-- code window on right -->
  <g transform="translate(730,86)">
    <rect width="410" height="170" rx="16" fill="#0b1020" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <rect width="410" height="28" rx="16" fill="#ffffff" fill-opacity="0.05"/>
    <rect y="14" width="410" height="14" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="18" cy="14" r="4.5" fill="#f87171"/>
    <circle cx="34" cy="14" r="4.5" fill="#fbbf24"/>
    <circle cx="50" cy="14" r="4.5" fill="#34d399"/>
    <text x="385" y="18" text-anchor="end" font-family="'Fira Code', ui-monospace, monospace" font-size="10" fill="#94a3b8">profile.ts</text>
    <g font-family="'Fira Code', ui-monospace, monospace" font-size="12.5">
      <text x="20" y="58" fill="#a78bfa">const</text>
      <text x="68" y="58" fill="#e2e8f0"> identity </text>
      <text x="138" y="58" fill="#94a3b8">=</text>
      <text x="154" y="58" fill="#e2e8f0"> {</text>
      <text x="30" y="78" fill="#94a3b8">name:</text>
      <text x="78" y="78" fill="#34d399">"Zakii Maalik"</text>
      <text x="196" y="78" fill="#94a3b8">,</text>
      <text x="30" y="98" fill="#94a3b8">role:</text>
      <text x="78" y="98" fill="#67e8f9">"Full Stack Dev"</text>
      <text x="206" y="98" fill="#94a3b8">,</text>
      <text x="30" y="118" fill="#94a3b8">focus:</text>
      <text x="82" y="118" fill="#fbbf24">["web","mobile","cloud"]</text>
      <text x="20" y="138" fill="#e2e8f0">}</text>
      <text x="20" y="160" fill="#67e8f9">ship</text>
      <text x="58" y="160" fill="#e2e8f0">(idea → production)</text>
      <text x="230" y="160" fill="#34d399">✓</text>
    </g>
  </g>

  <!-- footer gradient line -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#accent)" opacity="0.7"/>
  <rect x="0" y="0" width="1200" height="1" fill="#ffffff" fill-opacity="0.08"/>
</svg>