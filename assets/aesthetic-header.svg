<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Zakii Maalik — Full Stack Developer">
  <title>Zakii Maalik — Full Stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="55%" stop-color="#0a0d1a"/>
      <stop offset="100%" stop-color="#0d1326"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="auroraBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- animated aurora blobs -->
  <g filter="url(#auroraBlur)">
    <circle cx="280" cy="130" r="190" fill="url(#aurora1)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 50,25; -20,10; 0,0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.85;0.8" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="180" r="210" fill="url(#aurora2)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -45,-18; 28,22; 0,0" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;0.9;0.75;0.65" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="260" r="150" fill="#a78bfa" fill-opacity="0.2">
      <animateTransform attributeName="transform" type="translate" values="0,0; 35,-25; -25,18; 0,0" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M60 0V300M180 0V300M300 0V300M420 0V300M540 0V300M660 0V300M780 0V300M900 0V300M1020 0V300M1140 0V300"/>
  </g>

  <!-- twinkling stars -->
  <g filter="url(#soft)">
    <circle cx="100" cy="50" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="92" r="1.0" fill="#c4b5fd"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="48" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="100" r="1.1" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="4.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="52" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.7s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="108" r="1.0" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="58" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.6s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="125" r="1.0" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.5s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="248" r="1.0" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.9s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="258" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="252" r="1.0" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="4.1s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="262" r="1.3" fill="#a78bfa"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="4.8s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- left glass card -->
  <g transform="translate(60,46)">
    <rect width="620" height="208" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <rect width="620" height="1" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="0" y="28" width="4" height="152" rx="2" fill="url(#accent)"/>

    <!-- eyebrow -->
    <g transform="translate(34,24)">
      <circle cx="6" cy="6" r="3" fill="#a78bfa"/>
      <text x="16" y="10" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="4" fill="#a5b4fc">FULL STACK DEVELOPER</text>
    </g>

    <!-- name -->
    <text x="34" y="78" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#nameGrad)">Zakii Maalik</text>
    <!-- handle -->
    <text x="34" y="108" font-family="'Fira Code', ui-monospace, monospace" font-size="19" font-weight="500" fill="#cbd5e1">@xynnthincc</text>
    <!-- divider -->
    <rect x="34" y="126" width="120" height="2" rx="1" fill="url(#accent)">
      <animate attributeName="width" values="120;240;120" dur="6s" repeatCount="indefinite"/>
    </rect>
    <!-- tagline -->
    <text x="34" y="154" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#cbd5e1">Web · Mobile · Cloud · Web3</text>
    <!-- chips -->
    <g transform="translate(34,170)" font-family="'Fira Code', ui-monospace, monospace" font-size="10.5" font-weight="600">
      <g>
        <rect width="78" height="18" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.5"/>
        <text x="39" y="12.5" text-anchor="middle" fill="#c4b5fd">TypeScript</text>
      </g>
      <g transform="translate(88,0)">
        <rect width="62" height="18" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#67e8f9" stroke-opacity="0.5"/>
        <text x="31" y="12.5" text-anchor="middle" fill="#67e8f9">Next.js</text>
      </g>
      <g transform="translate(160,0)">
        <rect width="46" height="18" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.5"/>
        <text x="23" y="12.5" text-anchor="middle" fill="#a78bfa">.NET</text>
      </g>
      <g transform="translate(216,0)">
        <rect width="64" height="18" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#fbbf24" stroke-opacity="0.5"/>
        <text x="32" y="12.5" text-anchor="middle" fill="#fbbf24">Kotlin</text>
      </g>
      <g transform="translate(290,0)">
        <rect width="74" height="18" rx="9" fill="#ffffff" fill-opacity="0.06" stroke="#f472b6" stroke-opacity="0.5"/>
        <text x="37" y="12.5" text-anchor="middle" fill="#f472b6">Laravel</text>
      </g>
    </g>
  </g>

  <!-- right creative code card -->
  <g transform="translate(740,46)">
    <rect width="400" height="208" rx="20" fill="#0b1020" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- title / availability banner -->
    <rect width="400" height="38" rx="20" fill="#ffffff" fill-opacity="0.05"/>
    <rect y="19" width="400" height="19" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="20" cy="19" r="4.5" fill="#f87171"/>
    <circle cx="36" cy="19" r="4.5" fill="#fbbf24"/>
    <circle cx="52" cy="19" r="4.5" fill="#34d399"/>
    <text x="70" y="22" font-family="'Fira Code', ui-monospace, monospace" font-size="10.5" fill="#94a3b8">workspace/profile.ts</text>
    <rect x="286" y="8" width="98" height="22" rx="11" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="335" y="22.5" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="10" font-weight="700" fill="#34d399">● AVAILABLE</text>

    <!-- subtle inner glow divider -->
    <rect x="16" y="38" width="368" height="1" fill="#ffffff" fill-opacity="0.08"/>

    <!-- code lines -->
    <g font-family="'Fira Code', ui-monospace, monospace" font-size="12.5">
      <text x="20" y="58" fill="#a78bfa">const</text>
      <text x="68" y="58" fill="#e2e8f0"> identity </text>
      <text x="138" y="58" fill="#94a3b8">=</text>
      <text x="154" y="58" fill="#e2e8f0"> {</text>

      <text x="30" y="78" fill="#94a3b8">name:</text>
      <text x="78" y="78" fill="#a78bfa">"Zakii Maalik"</text>
      <text x="196" y="78" fill="#94a3b8">,</text>

      <text x="30" y="98" fill="#94a3b8">role:</text>
      <text x="78" y="98" fill="#67e8f9">"Full Stack Dev"</text>
      <text x="206" y="98" fill="#94a3b8">,</text>

      <text x="30" y="118" fill="#94a3b8">focus:</text>
      <text x="82" y="118" fill="#fbbf24">["web","mobile","cloud"]</text>

      <text x="20" y="138" fill="#e2e8f0">}</text>

      <text x="20" y="158" fill="#67e8f9">deploy</text>
      <text x="76" y="158" fill="#e2e8f0">(idea → production)</text>
      <text x="236" y="158" fill="#a78bfa">✓</text>

      <!-- terminal prompt row -->
      <text x="20" y="182" fill="#34d399">❯</text>
      <text x="34" y="182" fill="#94a3b8">npm run build</text>
      <rect x="128" y="172" width="7" height="12" fill="#a78bfa">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- bottom stack strip -->
    <g transform="translate(16,194)">
      <rect width="368" height="1" fill="#ffffff" fill-opacity="0.06"/>
    </g>
  </g>

  <!-- footer line -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#accent)" opacity="0.7"/>
  <rect x="0" y="0" width="1200" height="1" fill="#ffffff" fill-opacity="0.08"/>
</svg>