<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Zakii Maalik — Full Stack Developer">
  <rect width="1200" height="280" fill="#05070c"/>
  <g>
    <circle cx="120" cy="50" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="95" r="1.0" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="40" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="80" r="1.1" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="45" r="1.4" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.8s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="100" r="1.1" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.65;0.1" dur="4.1s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="55" r="1.3" fill="#ffffff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="120" r="1.0" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="220" r="1.0" fill="#22d3ee"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.7s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="245" r="1.2" fill="#ffffff"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.4s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="230" r="1.1" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="3.9s" begin="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="250" r="1.3" fill="#22d3ee"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.6s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>
  <!-- subtle scan line -->
  <rect x="0" y="0" width="1200" height="1" fill="#22d3ee" opacity="0.25">
    <animate attributeName="y" values="0;280;0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.0;0.25;0.0" dur="9s" repeatCount="indefinite"/>
  </rect>
  <!-- left accent bar -->
  <rect x="72" y="90" width="5" height="100" rx="2.5" fill="#22d3ee"/>
  <!-- eyebrow -->
  <text x="96" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#64748b">FULL STACK DEVELOPER</text>
  <!-- title -->
  <text x="96" y="140" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="#ffffff">Zakii Maalik</text>
  <!-- handle -->
  <text x="96" y="172" font-family="'Fira Code', ui-monospace, monospace" font-size="18" font-weight="500" fill="#94a3b8">xynnthincc</text>
  <!-- subtitle -->
  <text x="96" y="202" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#64748b">Web · Mobile · Cloud · Web3</text>
  <!-- animated accent divider -->
  <rect x="96" y="228" width="240" height="3" rx="1.5" fill="#22d3ee">
    <animate attributeName="width" values="240;400;240" dur="5s" repeatCount="indefinite"/>
  </rect>
  <!-- corner badge -->
  <g transform="translate(1020,30)">
    <rect width="132" height="30" rx="15" fill="#0b1220" stroke="#22d3ee" stroke-width="1.2" opacity="0.95"/>
    <circle cx="16" cy="15" r="3.5" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="20" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="11" font-weight="600" fill="#e0f2fe">OPEN TO WORK</text>
  </g>
</svg>
