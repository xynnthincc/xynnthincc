  <rect x="72" y="90" width="5" height="100" rx="2.5" fill="#22d3ee"/>
  <text x="96" y="80" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#64748b">FULL STACK DEVELOPER</text>
  <text x="96" y="140" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" fill="#ffffff">Zakii Maalik</text>
  <text x="96" y="172" font-family="'Fira Code', ui-monospace, monospace" font-size="18" font-weight="500" fill="#94a3b8">xynnthincc</text>
  <text x="96" y="202" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#64748b">Web · Mobile · Cloud · Web3</text>
  <rect x="96" y="228" width="240" height="3" rx="1.5" fill="#22d3ee">
    <animate attributeName="width" values="240;400;240" dur="5s" repeatCount="indefinite"/>
  </rect>
