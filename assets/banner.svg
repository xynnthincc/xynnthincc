    <circle cx="700" cy="50" r="1.4" fill="#fff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="110" r="1.3" fill="#67e8f9"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="4.2s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="70" r="1.2" fill="#fff"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.8s" begin="2s" repeatCount="indefinite"/></circle>
