    <circle cx="16" cy="15" r="3.5" fill="#22d3ee"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="70" y="20" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="11" font-weight="600" fill="#e0f2fe">OPEN TO WORK</text>
